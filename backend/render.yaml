services:
  - type: web
    name: flowpilot-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: hypercorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
